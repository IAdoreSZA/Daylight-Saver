name: Release

# Push a tag like v1.0.0-mc26.3 to build the plugin and publish a GitHub release with the jar attached.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B package
      - name: Read versions
        id: version
        run: |
          VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "plugin=${VERSION%-mc*}" >> "$GITHUB_OUTPUT"
          echo "minecraft=${VERSION##*-mc}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: DaylightSaver ${{ steps.version.outputs.plugin }} (Minecraft ${{ steps.version.outputs.minecraft }})
          body: |
            For **Paper ${{ steps.version.outputs.minecraft }}** (requires Java 25).

            Drop `DaylightSaver-*.jar` into your server's `plugins` folder and restart. See the README for configuration.
          files: target/DaylightSaver-*.jar
